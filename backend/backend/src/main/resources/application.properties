spring.application.name=${SPRING_APPLICATION_NAME:civicsense-backend}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:civicsense_db}}
spring.datasource.username=${DB_USER:civicsense_user}
spring.datasource.password=${DB_PASSWORD:civicsense_password}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=${SERVER_PORT:8031}

spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=filesystem:../../database/migrations

# DEV ONLY fallback. Production must provide JWT_SECRET through secrets/env.
jwt.secret=${JWT_SECRET:civicsense_dev_secret_change_before_production_please_123456789}
jwt.expiration=${JWT_EXPIRATION:604800000}

file.upload-dir=${FILE_UPLOAD_DIR:uploads}
app.uploads.public=${UPLOADS_PUBLIC:true}
app.storage.provider=${STORAGE_PROVIDER:local}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.folder=${CLOUDINARY_FOLDER:civicsense}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:${SERVER_PORT:8031}}
app.ai-service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:civicsense-ai-group}
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.properties.spring.json.trusted.packages=com.civicsense.backend.dto
spring.kafka.producer.properties.spring.json.add.type.headers=false
app.kafka.topic.issue-image-uploaded=${KAFKA_TOPIC_ISSUE_IMAGE_UPLOADED:issue-image-uploaded}

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:25MB}
