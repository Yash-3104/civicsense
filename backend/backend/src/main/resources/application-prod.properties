spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=filesystem:../../database/migrations

server.port=${SERVER_PORT:8031}

# In production, provide these through real environment variables/secrets.
# Never run backend/backend/sql/demo_seed_optional.sql on production.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET:}

app.public-base-url=${PUBLIC_BASE_URL:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.ai-service.base-url=${AI_SERVICE_BASE_URL}
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
app.uploads.public=${UPLOADS_PUBLIC:true}
